[package]
name = "kopfrechner"
authors = ["Wolfgang Schwendtbauer"]
repository = "https://github.com/Woife5/kopfrechner"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"

[dependencies]
colored = "3.1.1"
dialoguer = "0.12.0"
rand = "0.10.3"
self_update = { version = "1.3.0", default-features = false, features = ["archive-tar", "archive-zip", "checksums", "compression-tar-xz", "compression-zip-deflate", "github", "progress-bar", "reqwest", "rustls"] }

# Cargo-dist config
[profile.dist]
inherits = "release"
lto = "thin"
